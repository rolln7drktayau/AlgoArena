name: Build Desktop Installers

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.dist }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: win
          - os: ubuntu-latest
            dist: linux
          - os: macos-latest
            dist: mac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux packaging prerequisites
        if: matrix.dist == 'linux'
        run: |
          sudo apt update
          sudo apt install -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm

      - name: Build and package
        run: npm run dist:${{ matrix.dist }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: algoarena-${{ matrix.dist }}
          path: dist-electron/**
          if-no-files-found: error
