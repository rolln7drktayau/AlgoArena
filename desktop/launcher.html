<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self'"><title>AlgoArena</title><link rel="stylesheet" href="launcher.css"></head>
<body><header><img src="assets/icon.png" alt=""><div><h1>AlgoArena</h1><p data-copy="tagline"></p></div><label class="language"><span data-copy="language"></span><select id="language"><option value="fr">Français</option><option value="en">English</option></select></label></header>
<main><h2 data-copy="heading"></h2><p data-copy="intro"></p>
<div class="choices"><button data-target="desktop" disabled><strong data-copy="desktop"></strong><span data-copy="desktopDescription"></span><b data-copy="openDesktop"></b></button><button data-target="web" disabled><strong data-copy="web"></strong><span data-copy="webDescription"></span><b data-copy="openWeb"></b></button></div>
<p class="note" data-copy="modes"></p><p id="status" role="status" aria-live="polite"></p>
<footer><span data-copy="stopHelp"></span><button id="quit" data-copy="quit"></button></footer></main><script src="launcher.js"></script></body></html>
