[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algoarena"
version = "3.0.0"
description = "Interactive optimization algorithm benchmarking, visualization, and scenario simulation platform."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "AST & RCT" }
]
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.35.0",
  "numpy==2.2.2",
  "pandas==2.2.3",
  "pymoo==0.6.1.5",
  "deap==1.4.3",
  "python-multipart==0.0.32",
  "reportlab==4.2.5",
  "RestrictedPython==8.5",
  "starlette==1.6.0",
  "click==8.5.0",
  "idna==3.20",
  "pillow==12.3.0",
  "python-dotenv==1.2.3",
  "scipy==1.17.1"
]

[project.scripts]
algoarena = "algoarena_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["algoarena_cli*", "backend*", "algorithms*", "problems*"]
